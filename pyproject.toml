[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stxm"
version = "0.1.0"
description = "STXM line-scan toolkit: load .hdr/.xim, region selection, Beer-Lambert NEXAFS, mass absorption, experiment parquet"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "ipywidgets",
    "periodictable",
    "pyarrow",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "scienceplots>=2.2.1",
]

[tool.setuptools.packages.find]
where = ["src/python"]

[project.scripts]
stxm-bridge = "stxm.bridge:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
